%YAML:1.0

# ==================================================
# 颜色筛选
# ==================================================

# 灯条至少要有这么亮
liang_min: 130

# 饱和度至少这么高
# 白色窗户虽然亮，但饱和度很低，会被筛掉
sat_min: 90

# 红色必须明显高于 B/G
color_cha: 35


# ==================================================
# 单根灯条
# ==================================================

# 灯条最短长度
deng_min_chang: 8.0

# 宽 / 长
deng_min_bili: 0.06
deng_max_bili: 0.48

# 相对竖直方向的最大角度
# 0度 = 竖直
# 90度 = 横着
deng_max_jiaodu: 25.0

# 轮廓占旋转矩形面积比例
# 太空、太细碎的轮廓不要
tianchong_min: 0.35


# ==================================================
# 两根灯条配对
# ==================================================

# 两灯条长度比例
min_deng_bili: 0.72

# 两根灯条角度差
deng_jiaodu_cha: 10.0

# 两灯条中心高度差 / 平均灯条长度
max_y_cha: 0.45

# 整块装甲板最多倾斜多少度
ban_max_jiaodu: 15.0


# 小装甲板
# 两灯条水平距离 / 平均灯条长度
xiao_min_juli: 0.8
xiao_max_juli: 3.0


# 大装甲板
da_min_juli: 3.0
da_max_juli: 5.2